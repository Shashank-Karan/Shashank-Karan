name: Process Go move
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  move:
    if: contains(github.event.issue.labels.*.name, 'go-move') || contains(github.event.issue.body, 'Move:') || startsWith(github.event.issue.title, 'Go ')
    concurrency:
      group: community-go-move
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Start from latest board
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Validate and apply move
        id: apply
        run: node src/validate.js
      - name: Commit game state
        run: |
          git config user.name 'community-go-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md data/ assets/board.svg
          if git diff --cached --quiet; then
            echo 'No game-state changes were generated; refusing to close the issue.'
            exit 1
          fi
          git commit -m "go: process issue #${{ github.event.issue.number }}"
          git push origin HEAD:main
      - name: Verify committed board state
        run: |
          test -s assets/board.svg
          test -s README.md
          test -s data/game.json
          grep -q 'Move count' README.md
      - name: Close processed issue
        if: success() && github.event.issue != null
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, labels: ['move-processed']});
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: 'Accepted. The board, move history, and statistics have been updated. Refresh the README to see the new position.'});
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed'});
      - name: Mark rejected issue
        if: failure() && github.event.issue != null
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, labels: ['move-rejected']});
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: 'This move was rejected. Open the failed workflow run for the exact reason, then choose another coordinate from the README.'});
