name: Checks
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm test
      - run: npm run validate
      - run: node --check src/go.js
        - name: Check JavaScript syntax
          shell: bash
          run: for file in src/*.js test/*.js; do node --check "$file"; done
      - run: node src/cli.js generate
