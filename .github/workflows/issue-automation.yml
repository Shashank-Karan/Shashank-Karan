name: Issue automation
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  label:
    if: github.event.issue != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (/go\s+(move|pass)|move:/i.test(`${issue.title}\n${issue.body || ''}`)) {
              await github.rest.issues.addLabels({owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, labels: ['go-move']});
            }
