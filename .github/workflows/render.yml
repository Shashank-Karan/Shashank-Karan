name: Render board
on:
  push:
    paths: ['data/**', 'src/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node src/cli.js generate
      - run: |
          git config user.name 'community-go-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md
          git commit -m 'go: refresh board' || true
          git push
